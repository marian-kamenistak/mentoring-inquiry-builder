name: ci

# mentoring-inquiry-builder is a PUBLIC repo. src/data/mentoring-catalog.json (real
# pricing, negotiation floor/rules, internal sourcing notes) is deliberately gitignored
# and generated locally by web/mc-web (a PRIVATE repo) — it can never exist in this repo's
# CI, and must never be bundled by a CI-run `wrangler deploy`, which would ship
# fake/placeholder data straight to production if the fixture were ever in place at
# deploy time.
#
# So this workflow verifies (test + type-check, against a redacted fixture — see
# src/data/mentoring-catalog.fixture.json) but does NOT deploy. Deploy stays a manual
# `npm run deploy` from Marian's Mac, exactly as it is today, using the real local file.
# Same posture as elc-partnership-builder's ci.yml, for the same reason.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      # The real src/data/mentoring-catalog.json never exists in this checkout (gitignored,
      # generated by a private sibling repo). Stand the redacted fixture in for it so
      # catalog.ts's static import resolves — see the fixture's own generation note for
      # what was redacted and why.
      - name: Stand in the redacted fixture for the real (gitignored) catalog
        run: cp src/data/mentoring-catalog.fixture.json src/data/mentoring-catalog.json

      - name: Test
        run: npm test

      # worker-configuration.d.ts (Cloudflare Workers ambient runtime types) is gitignored
      # and only exists on Marian's Mac because `wrangler types` was already run there.
      - name: Generate Cloudflare Workers runtime types
        run: npm run cf-typegen

      - name: Type check
        run: npm run type-check
